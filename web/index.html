<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Golf Course Viewer</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b0d10; }
      #map { position: absolute; inset: 0; }
      #hit {
        position: absolute; left: 12px; bottom: 12px; z-index: 2;
        font: 600 14px/1 system-ui, sans-serif; color: #fff;
        background: #1a7f37; border: none; border-radius: 8px;
        padding: 10px 16px; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.4);
      }
      #hit:active { transform: translateY(1px); }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <button id="hit">Hit</button>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
